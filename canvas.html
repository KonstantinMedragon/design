    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f5f5f7;

        /* ===== BACK BUTTON ===== */
        .back-button-wrap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 24px 24px 8px;
            background: transparent;
            z-index: 20;
            pointer-events: none;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #111;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            border: 1px solid #e8e8ec;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
            pointer-events: auto;
        }

        .back-button i {
            font-size: 12px;

        }

        .back-button:hover {
            transform: translateY(-2px);

            color: #4a117c;
            box-shadow: 0 8px 20px rgba(74, 17, 124, 0.15);
        }

        .back-button:hover i { transform: translateX(-3px); }

        @media (max-width: 768px) {
            .back-button-wrap { padding: 16px 16px 4px; }
            .back-button { padding: 8px 14px; font-size: 12px; gap: 6px; }
            .back-button i { font-size: 11px; }
        }

<body>

    <!-- BACK BUTTON -->
    <div class="back-button-wrap">
        <a href="art.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            <span>Back to exhibition</span>
        </a>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, cylinderGroup;
        const clickableObjects = [];

        const projects = [
            { name: 'Water',  element: 'water',  url: 'https://bau.in.th/service-en.html',                img: 'images/water.webp' },
            { name: 'Wood',   element: 'wood',   url: 'https://samuibrew.tilda.ws/bread',                 img: 'images/tree.webp' },
            { name: 'Fire',   element: 'fire',   url: 'https://konstantinmedragon.github.io/CVBakharev/', img: 'images/fire.webp' },
            { name: 'Earth',  element: 'earth',  url: 'https://medragon.tilda.ws/course',                 img: 'images/eart.webp' },
            { name: 'Metal',  element: 'metal',  url: 'https://pilatesbodyhome.ru/studio.html',           img: 'images/metal.webp' }
        ];

        // ===== Хелпер: тонкая труба между двумя точками =====
        function createBeam(p1, p2, color, thickness, emissiveIntensity) {
            const path = new THREE.LineCurve3(p1, p2);
            const geo = new THREE.TubeGeometry(path, 1, thickness, 8, false);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: emissiveIntensity || 0.4,
                roughness: 0.3,
                metalness: 0.2
            });
            return new THREE.Mesh(geo, mat);
        }

        function updateCylinder() {
            const isMobile = window.innerWidth < 768;

            const topOffset = 80;
            const bottomOffset = 60;
            const availableHeight = window.innerHeight - topOffset - bottomOffset;

            let scaleFactor;
            if (isMobile) scaleFactor = Math.min(availableHeight / 700, 1.2);
            else scaleFactor = Math.min(availableHeight / 800, 1.0);

            let baseRadius, basePlaneWidth, basePlaneHeight, baseCameraDistance, baseSceneOffsetY;
            if (isMobile) {
                baseRadius = 0.5;
                basePlaneWidth = 0.35;
                basePlaneHeight = 0.7;
                baseCameraDistance = 2.8;
                baseSceneOffsetY = 0.4;
            } else {
                baseRadius = 2.28;
                basePlaneWidth = 1.0;
                basePlaneHeight = 2.0;
                baseCameraDistance = 6.1;
                baseSceneOffsetY = 1.2;
            }

            const radius = baseRadius * scaleFactor;
            const planeWidth = basePlaneWidth * scaleFactor;
            const planeHeight = basePlaneHeight * scaleFactor;
            const cameraDistance = baseCameraDistance * scaleFactor;
            const sceneOffsetY = baseSceneOffsetY * scaleFactor;

            const count = projects.length;
            const angleStep = (Math.PI * 2) / count;

            clickableObjects.forEach((plane, idx) => {
                if (plane.userData && plane.userData.type === 'painting') {
                    const angle = idx * angleStep;
                    const x = Math.sin(angle) * radius;
                    const z = Math.cos(angle) * radius;
                    plane.position.set(x, sceneOffsetY, z);

                    const direction = new THREE.Vector3(x, 0, z).normalize();
                    plane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction);

                    if (plane.geometry) plane.geometry.dispose();
                    plane.geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
                }
            });

            camera.position.set(0, sceneOffsetY + 0.5 * scaleFactor, cameraDistance);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            controls.target.set(0, sceneOffsetY, 0);
            controls.update();
        }

        function initScene() {
            const isMobile = window.innerWidth < 768;

            const topOffset = 80;
            const bottomOffset = 60;
            const availableHeight = window.innerHeight - topOffset - bottomOffset;

            let scaleFactor;
            if (isMobile) scaleFactor = Math.min(availableHeight / 700, 1.2);
            else scaleFactor = Math.min(availableHeight / 800, 1.0);

            let baseRadius, basePlaneWidth, basePlaneHeight, baseCameraDistance, baseSceneOffsetY;
            if (isMobile) {
                baseRadius = 0.5;
                basePlaneWidth = 0.35;
                basePlaneHeight = 0.7;
                baseCameraDistance = 2.8;
                baseSceneOffsetY = 0.4;
            } else {
                baseRadius = 2.28;
                basePlaneWidth = 1.0;
                basePlaneHeight = 2.0;
                baseCameraDistance = 6.1;
                baseSceneOffsetY = 1.2;
            }

            const radius = baseRadius * scaleFactor;
            const planeWidth = basePlaneWidth * scaleFactor;
            const planeHeight = basePlaneHeight * scaleFactor;
            const cameraDistance = baseCameraDistance * scaleFactor;
            const sceneOffsetY = baseSceneOffsetY * scaleFactor;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f7);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, sceneOffsetY + 0.5 * scaleFactor, cameraDistance);
            camera.lookAt(0, sceneOffsetY, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // ===== СВЕТ =====
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);
            const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
            backLight.position.set(-1, 1, -1);
            scene.add(backLight);

            // ===== ЦИЛИНДР ИЗ КАРТИН =====
            const count = projects.length;
            const angleStep = (Math.PI * 2) / count;
            cylinderGroup = new THREE.Group();
            const textureLoader = new THREE.TextureLoader();

            projects.forEach((project, index) => {
                const angle = index * angleStep;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;

                const texture = textureLoader.load(project.img);
                texture.minFilter = THREE.LinearFilter;

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    side: THREE.DoubleSide,
                    roughness: 0.3,
                    metalness: 0.05
                });

                const plane = new THREE.Mesh(
                    new THREE.PlaneGeometry(planeWidth, planeHeight),
                    material
                );

                plane.position.set(x, sceneOffsetY, z);

                const direction = new THREE.Vector3(x, 0, z).normalize();
                plane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction);

                plane.userData = { url: project.url, name: project.name, type: 'painting' };
                clickableObjects.push(plane);
                cylinderGroup.add(plane);
            });

            // ===== ПЕНТАГРАММА ВНУТРИ =====
            // Радиус заметно меньше цилиндра, чтобы лучи не прорезали картины
            const innerRadius = radius * 0.72;
            const innerY = sceneOffsetY;

            // Вершины пентаграммы
            const pentPoints = [];
            for (let i = 0; i < 5; i++) {
                const a = i * angleStep;
                pentPoints.push(new THREE.Vector3(
                    Math.sin(a) * innerRadius,
                    innerY,
                    Math.cos(a) * innerRadius
                ));
            }

            // Красный цвет пентаграммы
            const pentagramColor = 0xd42020;

            // Окружность, соединяющая концы лучей (вместо пентагона)
            const circleGeo = new THREE.TorusGeometry(innerRadius, 0.022 * scaleFactor, 12, 128);
            const circleMat = new THREE.MeshStandardMaterial({
                color: pentagramColor,
                emissive: pentagramColor,
                emissiveIntensity: 0.35,
                roughness: 0.3,
                metalness: 0.2
            });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = Math.PI / 2;
            circle.position.y = innerY;
            cylinderGroup.add(circle);

            // Пентаграмма — цикл контроля (лучи через одну вершину)
            for (let i = 0; i < 5; i++) {
                const beam = createBeam(
                    pentPoints[i],
                    pentPoints[(i + 2) % 5],
                    pentagramColor,
                    0.028 * scaleFactor,
                    0.65
                );
                cylinderGroup.add(beam);
            }

            scene.add(cylinderGroup);

            // ===== УПРАВЛЕНИЕ =====
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.2;
            controls.enableZoom = true;
            controls.enablePan = false;
            controls.zoomSpeed = 0.8;
            controls.target.set(0, sceneOffsetY, 0);
            controls.rotateSpeed = 1.0;

            // ===== КЛИКИ =====
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            function onPointerClick(event) {
                let clientX, clientY;
                if (event.touches) {
                    clientX = event.touches[0].clientX;
                    clientY = event.touches[0].clientY;
                } else {
                    clientX = event.clientX;
                    clientY = event.clientY;
                }

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(clickableObjects);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit.userData && hit.userData.url) {
                        window.open(hit.userData.url, '_blank');
                    }
                }
            }

            window.addEventListener('click', onPointerClick, false);
            window.addEventListener('touchstart', onPointerClick, false);

            function resetAndRestartAutoRotate() {
                if (controls) {
                    controls.autoRotate = false;
                    setTimeout(() => { controls.autoRotate = true; }, 100);
                }
            }

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) resetAndRestartAutoRotate();
            });
            window.addEventListener('focus', resetAndRestartAutoRotate);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', updateCylinder);
        }

        initScene();
    </script>
</body>
