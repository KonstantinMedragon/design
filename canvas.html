    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f5f5f7;
            font-family: 'Inter', sans-serif;
            color: #111;
            line-height: 1.5;
            overflow: hidden;
            height: 100vh;
        }

        canvas { cursor: pointer; }

        /* ===== BACK BUTTON ===== */
        .back-button-wrap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 24px 24px 8px;
            background: transparent;
            z-index: 20;
            pointer-events: none;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #111;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            border: 1px solid #e8e8ec;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
            pointer-events: auto;
        }

        .back-button i {
            font-size: 12px;
            color: #4a117c;
            transition: transform 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            border-color: #4a117c;

            box-shadow: 0 8px 20px rgba(74, 17, 124, 0.15);
        }

        .back-button:hover i { transform: translateX(-3px); }

        @media (max-width: 768px) {
            .back-button-wrap { padding: 16px 16px 4px; }
            .back-button { padding: 8px 14px; font-size: 12px; gap: 6px; }
            .back-button i { font-size: 11px; }
        }
    </style>

<body>

    <!-- BACK BUTTON -->
    <div class="back-button-wrap">
        <a href="art.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            <span>Back to exhibition</span>
        </a>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, cylinderGroup;
        const clickableObjects = [];

        /* =========================================================
           1. ПРОЕКТЫ — у каждого своя страница
           ========================================================= */
        const projects = [
            { name: 'Water', element: 'water', url: 'water.html', img: 'images/water.webp' },
            { name: 'Wood',  element: 'tree',  url: 'tree.html',  img: 'images/tree.webp'  },
            { name: 'Fire',  element: 'fire',  url: 'fire.html',  img: 'images/fire.webp'  },
            { name: 'Earth', element: 'earth', url: 'earth.html', img: 'images/eart.webp'  },
            { name: 'Metal', element: 'metal', url: 'metal.html', img: 'images/metal.webp' }
        ];

        /* Текущая раскладка сцены (пересчитывается при ресайзе) */
        let layout = {
            radius: 2.28,
            maxPanelWidth: 1.5,
            maxPanelHeight: 2.0,
            cameraDistance: 6.1,
            sceneOffsetY: 1.2,
            scaleFactor: 1
        };

        /* ===== Хелпер: тонкая труба между двумя точками ===== */
        function createBeam(p1, p2, color, thickness, emissiveIntensity) {
            const path = new THREE.LineCurve3(p1, p2);
            const geo = new THREE.TubeGeometry(path, 1, thickness, 8, false);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: emissiveIntensity || 0.4,
                roughness: 0.3,
                metalness: 0.2
            });
            return new THREE.Mesh(geo, mat);
        }

        /* =========================================================
           2. ГЕОМЕТРИЯ «ТОЛСТОЙ КАРТИНЫ» (объёмный бокс)
           ---------------------------------------------------------
           UV-развёртка BoxGeometry: порядок граней
           0 = +X, 1 = -X, 2 = +Y, 3 = -Y, 4 = +Z, 5 = -Z
           по 4 вершины на грань.
           Торцы «заворачиваем» на крайние пиксели изображения,
           поэтому боковины получают цвет и фактуру самой картинки.
           ========================================================= */
        function makePanelGeometry(w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const uv = geo.attributes.uv;

            const setU = (faceIndex, value) => {
                for (let i = 0; i < 4; i++) uv.setX(faceIndex * 4 + i, value);
            };
            const setV = (faceIndex, value) => {
                for (let i = 0; i < 4; i++) uv.setY(faceIndex * 4 + i, value);
            };

            setU(0, 1);   // +X  -> правый край изображения
            setU(1, 0);   // -X  -> левый край изображения
            setV(2, 1);   // +Y  -> верхний край изображения
            setV(3, 0);   // -Y  -> нижний край изображения
            // 4 (+Z) и 5 (-Z) остаются как есть — полное изображение

            uv.needsUpdate = true;
            return geo;
        }

        /* =========================================================
           3. РАЗМЕР ПАНЕЛИ — по пропорциям самого изображения
           ========================================================= */
        function setPanelGeometry(mesh, maxW, maxH) {
            const aspect = (mesh.userData && mesh.userData.aspect) || 0.75;

            // Вписываем изображение в рамку maxW × maxH, сохраняя пропорции
            let h = maxH;
            let w = h * aspect;
            if (w > maxW) {
                w = maxW;
                h = w / aspect;
            }

            // Толщина ≈ 10% от высоты
            const d = Math.max(h * 0.1, 0.008);

            if (mesh.geometry) mesh.geometry.dispose();
            mesh.geometry = makePanelGeometry(w, h, d);

            mesh.userData.panelWidth  = w;
            mesh.userData.panelHeight = h;
            mesh.userData.panelDepth  = d;
        }

        /* =========================================================
           4. РАСЧЁТ РАСКЛАДКИ
           ========================================================= */
        function computeLayout() {
            const isMobile = window.innerWidth < 768;

            const topOffset = 80;
            const bottomOffset = 60;
            const availableHeight = window.innerHeight - topOffset - bottomOffset;

            let scaleFactor;
            if (isMobile) scaleFactor = Math.min(availableHeight / 700, 1.2);
            else          scaleFactor = Math.min(availableHeight / 800, 1.0);

            let baseRadius, basePlaneWidth, basePlaneHeight, baseCameraDistance, baseSceneOffsetY;
            if (isMobile) {
                baseRadius = 0.5;
                basePlaneWidth = 0.35;
                basePlaneHeight = 0.7;
                baseCameraDistance = 2.8;
                baseSceneOffsetY = 0.4;
            } else {
                baseRadius = 2.28;
                basePlaneWidth = 1.0;
                basePlaneHeight = 2.0;
                baseCameraDistance = 6.1;
                baseSceneOffsetY = 1.2;
            }

            const radius = baseRadius * scaleFactor;
            const count = projects.length;

            // Ширина «сектора» по хорде, чтобы картины не пересекались
            const slotWidth = 2 * radius * Math.sin(Math.PI / count) * 0.9;

            return {
                radius: radius,
                maxPanelWidth: Math.min(basePlaneWidth * 1.5 * scaleFactor, slotWidth),
                maxPanelHeight: basePlaneHeight * scaleFactor,
                cameraDistance: baseCameraDistance * scaleFactor,
                sceneOffsetY: baseSceneOffsetY * scaleFactor,
                scaleFactor: scaleFactor
            };
        }

        /* =========================================================
           5. ОБНОВЛЕНИЕ ПРИ РЕСАЙЗЕ
           ========================================================= */
        function updateCylinder() {
            layout = computeLayout();

            const radius = layout.radius;
            const sceneOffsetY = layout.sceneOffsetY;
            const count = projects.length;
            const angleStep = (Math.PI * 2) / count;

            clickableObjects.forEach((plane, idx) => {
                if (!plane.userData || plane.userData.type !== 'painting') return;

                const angle = idx * angleStep;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;
                plane.position.set(x, sceneOffsetY, z);

                const direction = new THREE.Vector3(x, 0, z).normalize();
                plane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction);

                setPanelGeometry(plane, layout.maxPanelWidth, layout.maxPanelHeight);
            });

            camera.position.set(0, sceneOffsetY + 0.5 * layout.scaleFactor, layout.cameraDistance);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            controls.target.set(0, sceneOffsetY, 0);
            controls.update();
        }

        /* =========================================================
           6. ИНИЦИАЛИЗАЦИЯ СЦЕНЫ
           ========================================================= */
        function initScene() {
            layout = computeLayout();

            const radius = layout.radius;
            const sceneOffsetY = layout.sceneOffsetY;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f7);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, sceneOffsetY + 0.5 * layout.scaleFactor, layout.cameraDistance);
            camera.lookAt(0, sceneOffsetY, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // ===== СВЕТ =====
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);
            const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
            backLight.position.set(-1, 1, -1);
            scene.add(backLight);

            // ===== ЦИЛИНДР ИЗ ОБЪЁМНЫХ КАРТИН =====
            const count = projects.length;
            const angleStep = (Math.PI * 2) / count;
            cylinderGroup = new THREE.Group();
            const textureLoader = new THREE.TextureLoader();
            const maxAniso = renderer.capabilities.getMaxAnisotropy();

            projects.forEach((project, index) => {
                const angle = index * angleStep;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;

                // Заглушка-геометрия, сразу же заменяется в setPanelGeometry
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.01, 0.01, 0.01),
                    null
                );

                mesh.userData = {
                    url: project.url,
                    name: project.name,
                    element: project.element,
                    type: 'painting',
                    aspect: 0.75          // временно, уточнится после загрузки картинки
                };

                const texture = textureLoader.load(project.img, (tex) => {
                    // Размер задаётся самим изображением
                    if (tex.image && tex.image.width && tex.image.height) {
                        mesh.userData.aspect = tex.image.width / tex.image.height;
                        setPanelGeometry(mesh, layout.maxPanelWidth, layout.maxPanelHeight);
                    }
                });
                texture.anisotropy = maxAniso;
                texture.wrapS = THREE.ClampToEdgeWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;

                // Один материал на все грани: торцы «заворачиваются»
                // на крайние пиксели картинки (см. makePanelGeometry)
                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.35,
                    metalness: 0.05
                });

                mesh.material = material;
                setPanelGeometry(mesh, layout.maxPanelWidth, layout.maxPanelHeight);

                mesh.position.set(x, sceneOffsetY, z);

                const direction = new THREE.Vector3(x, 0, z).normalize();
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction);

                clickableObjects.push(mesh);
                cylinderGroup.add(mesh);
            });

            // ===== ПЕНТАГРАММА ВНУТРИ =====
            const innerRadius = radius * 0.72;
            const innerY = sceneOffsetY;

            const pentPoints = [];
            for (let i = 0; i < 5; i++) {
                const a = i * angleStep;
                pentPoints.push(new THREE.Vector3(
                    Math.sin(a) * innerRadius,
                    innerY,
                    Math.cos(a) * innerRadius
                ));
            }

            const pentagramColor = 0xd42020;

            // Окружность, соединяющая концы лучей
            const circleGeo = new THREE.TorusGeometry(innerRadius, 0.022 * layout.scaleFactor, 12, 128);
            const circleMat = new THREE.MeshStandardMaterial({
                color: pentagramColor,
                emissive: pentagramColor,
                emissiveIntensity: 0.35,
                roughness: 0.3,
                metalness: 0.2
            });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = Math.PI / 2;
            circle.position.y = innerY;
            cylinderGroup.add(circle);

            // Пентаграмма — цикл контроля (лучи через одну вершину)
            for (let i = 0; i < 5; i++) {
                const beam = createBeam(
                    pentPoints[i],
                    pentPoints[(i + 2) % 5],
                    pentagramColor,
                    0.028 * layout.scaleFactor,
                    0.65
                );
                cylinderGroup.add(beam);
            }

            scene.add(cylinderGroup);

            // ===== УПРАВЛЕНИЕ =====
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = -1.2;   // ← обратное направление вращения
            controls.enableZoom = true;
            controls.enablePan = false;
            controls.zoomSpeed = 0.8;
            controls.target.set(0, sceneOffsetY, 0);
            controls.rotateSpeed = 1.0;

            // ===== КЛИКИ =====
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            function onPointerClick(event) {
                let clientX, clientY;
                if (event.touches) {
                    clientX = event.touches[0].clientX;
                    clientY = event.touches[0].clientY;
                } else {
                    clientX = event.clientX;
                    clientY = event.clientY;
                }

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(clickableObjects, false);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit.userData && hit.userData.url) {
                        window.location.href = hit.userData.url;   // своя страница для каждого элемента
                    }
                }
            }

            window.addEventListener('click', onPointerClick, false);
            window.addEventListener('touchstart', onPointerClick, false);

            function resetAndRestartAutoRotate() {
                if (controls) {
                    controls.autoRotate = false;
                    setTimeout(() => { controls.autoRotate = true; }, 100);
                }
            }

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) resetAndRestartAutoRotate();
            });
            window.addEventListener('focus', resetAndRestartAutoRotate);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', updateCylinder);
        }

        initScene();
    </script>
</body>
</html>
